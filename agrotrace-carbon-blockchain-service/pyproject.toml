[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrotrace-carbon-blockchain-service"
version = "1.0.0"
description = "Observer, evidence packager, hash/Merkle generator and simulated anchoring for Agrotrace Carbon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "web3>=6.20.0,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
blockchain-init-db = "scripts.init_db:main"
blockchain-worker = "scripts.run_worker_loop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "blockchain_local: integration tests that start Anvil locally",
    "sepolia: external Sepolia tests (require RUN_SEPOLIA_TESTS=1 and env)",
]
