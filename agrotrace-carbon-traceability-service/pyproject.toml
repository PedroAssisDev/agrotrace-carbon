[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agrotrace-carbon-provenance-service"
version = "0.1.0"
description = "Append-only provenance ledger for AgroTrace Carbon (data lineage, calculations, reviews, publications, anchoring)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "AgroTrace Carbon Team" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.34",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "uuid-utils>=0.9",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
    "testcontainers[postgres]>=4.7",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "hypothesis>=6.108",
]

[project.scripts]
provenance-service = "provenance_service.main:run"
provenance-outbox-worker = "provenance_service.interfaces.workers.outbox_worker:main"
provenance-seed-demo = "provenance_service.seed_demo_full_pipeline_001:main"
provenance-init-local-db = "provenance_service.local_db_init:main"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance_service"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "N",
    "C4",
    "SIM",
    "PT",
    "RUF",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "PT011"]
"alembic/**" = ["N999", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["provenance_service"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
mypy_path = "src"
explicit_package_bases = true
warn_return_any = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: pure-python unit tests, no IO",
    "integration: tests using SQLite (or PROV_TEST_DATABASE_URL)",
    "invariants: tests of structural invariants (append-only, idempotency, hashing)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
source = ["src/provenance_service"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
