[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecofarm-calculations"
version = "1.0.0"
description = "IPCC-aligned emission calculations for AgroTrace Carbon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["emissions*", "orchestration*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
