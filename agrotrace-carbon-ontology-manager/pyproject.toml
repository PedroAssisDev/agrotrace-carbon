[project]
name = "agromrv-o-lite"
version = "0.1.0"
description = "AgroMRV-O Lite — lightweight domain ontology for dairy MRV semantic integration"
requires-python = ">=3.9"
dependencies = [
    "owlready2>=0.45",
    "pandas>=2.0",
    "rdflib>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ontology*"]
exclude = ["tests*", "artifacts*", "docs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
