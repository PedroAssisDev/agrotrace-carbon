[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrotrace-carbon-frontend"
version = "1.0.0"
description = "Dash orchestrator UI for AgroTrace Carbon (local direct-call integration)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=4.0",
    "dash-bootstrap-components>=2.0",
    "plotly>=6.0",
    "pandas>=2.0",
    "numpy>=2.0",
    "joblib>=1.4",
    "owlready2>=0.40",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "scikit-learn>=1.5,<2",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --tb=line"
